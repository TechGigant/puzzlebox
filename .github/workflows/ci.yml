name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  live-ha:
    # Delegation tests against a real Home Assistant with the demo integration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start Home Assistant
        run: |
          mkdir -p ha && printf 'default_config:\ndemo:\n' > ha/configuration.yaml
          docker run -d --name ha -p 8123:8123 -v "$PWD/ha:/config" ghcr.io/home-assistant/home-assistant:stable
          for i in $(seq 1 90); do curl -sf localhost:8123/api/onboarding && break; sleep 2; done
      - name: Onboard and get a token
        run: |
          CID=http://localhost:8123/
          CODE=$(curl -s -X POST localhost:8123/api/onboarding/users -H 'Content-Type: application/json' \
            -d "{\"client_id\":\"$CID\",\"name\":\"CI\",\"username\":\"ci\",\"password\":\"cicicici\",\"language\":\"en\"}" | jq -r .auth_code)
          TOKEN=$(curl -s -X POST localhost:8123/auth/token -d "grant_type=authorization_code&code=$CODE&client_id=$CID" | jq -r .access_token)
          echo "::add-mask::$TOKEN"
          echo "HA_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - run: cargo test --locked -p puzzlebox-ha-client --test live_ha
        env:
          HA_WS_URL: ws://localhost:8123/api/websocket

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: custom_components examples/python-plugin
      - uses: home-assistant/actions/hassfest@master
      # HACS can only validate public repositories.
      - if: ${{ !github.event.repository.private }}
        uses: hacs/action@main
        with:
          category: integration

  wasm-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/wasm-plugin
      - run: cargo build --release --target wasm32-unknown-unknown
        working-directory: examples/wasm-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: example-wasm-plugin
          path: |
            examples/wasm-plugin/plugin.yaml
            examples/wasm-plugin/target/wasm32-unknown-unknown/release/puzzlebox_example_plugin.wasm

  image:
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/puzzlebox/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
