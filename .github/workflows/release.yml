name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image name and version
        run: |
          # GHCR names must be lowercase; the Supervisor pulls the tag that equals
          # the app version in config.yaml (no "v" prefix).
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' addon/puzzlebox/config.yaml)
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $APP_VERSION in addon/puzzlebox/config.yaml"
            exit 1
          fi
          # The app and integration compare these versions to ask for updates.
          INTEGRATION_VERSION=$(jq -r .version custom_components/puzzlebox/manifest.json)
          CRATE_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$VERSION" != "$INTEGRATION_VERSION" ] || [ "$VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json ($INTEGRATION_VERSION) or Cargo.toml ($CRATE_VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: addon/puzzlebox/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/puzzlebox-${{ matrix.arch }}:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER }}/puzzlebox-${{ matrix.arch }}:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  github-release:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v7
      - name: Package companion integration
        run: cd custom_components && zip -r ../puzzlebox.zip puzzlebox
      - uses: softprops/action-gh-release@v3
        with:
          files: puzzlebox.zip
          generate_release_notes: true
