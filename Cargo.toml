[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
puzzlebox-ha-client = { path = "crates/puzzlebox-ha-client" }
puzzlebox-engine = { path = "crates/puzzlebox-engine" }
puzzlebox-ir = { path = "crates/puzzlebox-ir" }
puzzlebox-registry = { path = "crates/puzzlebox-registry" }
puzzlebox-yaml-import = { path = "crates/puzzlebox-yaml-import" }

puzzlebox-storage = { path = "crates/puzzlebox-storage" }
async-trait = "0.1"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "query"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_yaml = "0.9"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
