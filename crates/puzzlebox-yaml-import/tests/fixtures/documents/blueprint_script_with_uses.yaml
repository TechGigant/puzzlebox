# The blueprint, then two scripts using it (config/blueprints/script/… pasted with scripts.yaml).
blueprint:
  name: Confirmable notification
  domain: script
  source_url: https://github.com/home-assistant/core/blob/dev/homeassistant/components/script/blueprints/confirmable_notification.yaml
  input:
    notify_device:
      name: Device to notify
      selector:
        device:
          integration: mobile_app
    title:
      name: Title
      default: ""
    message:
      name: Message
mode: restart
sequence:
  - alias: Send notification
    domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: !input title
    message: !input message
---
confirm_door:
  alias: Confirm door
  use_blueprint:
    path: homeassistant/confirmable_notification.yaml
    input:
      notify_device: 0123456789abcdef
      message: Is the door locked?
confirm_oven:
  use_blueprint:
    path: homeassistant/confirmable_notification.yaml
    input:
      notify_device: 0123456789abcdef
      title: Oven
