alias: First
triggers:
  - trigger: homeassistant
    event: start
actions:
  - action: persistent_notification.create
    data:
      message: Started
---
- alias: Second
  triggers:
    - trigger: time_pattern
      minutes: /5
  actions:
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.weather
---
scriptone:
  sequence:
    - action: light.toggle
      target:
        entity_id: light.desk
...
