# packages/garage.yaml
input_number:
  garage_timeout:
    min: 1
    max: 60
automation:
  - alias: Close garage at night
    triggers:
      - trigger: time
        at: "22:30:00"
    conditions:
      - condition: state
        entity_id: cover.garage
        state: open
    actions:
      - action: cover.close_cover
        target:
          entity_id: cover.garage
automation garage_light:
  - alias: Garage light with door
    triggers:
      - trigger: state
        entity_id: cover.garage
        to: open
    actions:
      - action: light.turn_on
        target:
          entity_id: light.garage
script:
  open_garage:
    sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.garage
